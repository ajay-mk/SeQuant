name: Fork CI timing experiment
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: fork-ci-timing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cold:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
        - os: ubuntu-24.04
          build_type: Release
          valgrind: false
          sanitize: false
          cxx: /usr/bin/g++-14
          sanitize_flags: -fsanitize=address -fsanitize=leak -fsanitize=undefined -fno-omit-frame-pointer -fno-var-tracking
          experiment: baseline
          build_jobs: 2
          test_jobs: 1
        - os: ubuntu-24.04
          build_type: Debug
          valgrind: false
          sanitize: false
          cxx: /usr/bin/g++-14
          sanitize_flags: -fsanitize=address -fsanitize=leak -fsanitize=undefined -fno-omit-frame-pointer -fno-var-tracking
          experiment: baseline
          build_jobs: 2
          test_jobs: 1
        - os: ubuntu-24.04
          build_type: Debug
          valgrind: true
          sanitize: false
          cxx: /usr/bin/g++-14
          sanitize_flags: -fsanitize=address -fsanitize=leak -fsanitize=undefined -fno-omit-frame-pointer -fno-var-tracking
          experiment: baseline
          build_jobs: 2
          test_jobs: 1
        - os: ubuntu-24.04
          build_type: Debug
          valgrind: false
          sanitize: true
          cxx: /usr/bin/g++-14
          sanitize_flags: -fsanitize=address -fsanitize=leak -fsanitize=undefined -fno-omit-frame-pointer -fno-var-tracking
          experiment: baseline
          build_jobs: 2
          test_jobs: 1
        - os: macos-26
          build_type: Release
          valgrind: false
          sanitize: false
          cxx: clang++
          sanitize_flags: -fsanitize=address -fsanitize=leak -fsanitize=undefined -fno-omit-frame-pointer -fno-var-tracking
          experiment: baseline
          build_jobs: 2
          test_jobs: 1
        - os: macos-26
          build_type: Debug
          valgrind: false
          sanitize: false
          cxx: clang++
          sanitize_flags: -fsanitize=address -fsanitize=leak -fsanitize=undefined -fno-omit-frame-pointer -fno-var-tracking
          experiment: baseline
          build_jobs: 2
          test_jobs: 1
        - os: windows-2025
          build_type: Release
          valgrind: false
          sanitize: false
          cxx: ''
          sanitize_flags: ''
          experiment: baseline
          build_jobs: 2
          test_jobs: 1
        - os: windows-2025
          build_type: Debug
          valgrind: false
          sanitize: false
          cxx: ''
          sanitize_flags: ''
          experiment: baseline
          build_jobs: 2
          test_jobs: 1
    name: 'cold / ${{ matrix.experiment || ''baseline'' }} / ${{ matrix.valgrind && ''Valgrind'' || matrix.sanitize && ''Sanitizers''
      || '''' }} ${{ matrix.os }}: ${{ matrix.cxx }} ${{ matrix.build_type }}'
    runs-on: ${{ matrix.os }}
    env:
      CXX: ${{ matrix.cxx }}
      DOXYGEN_VERSION: 1.9.1
      CCACHE_DIR: ${{github.workspace}}/build/.ccache
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 6
      BUILD_CONFIG: '-G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_SHARED_LIBS=OFF -DCMAKE_UNITY_BUILD=${{
        !matrix.sanitize && (matrix.build_type == ''Debug'' || matrix.valgrind) }} -DMPIEXEC_PREFLAGS=''--bind-to;none;--allow-run-as-root''
        -DCMAKE_PREFIX_PATH=''/usr/local/opt/boost'' -DSEQUANT_TESTS=ON -DSEQUANT_EVAL_TESTS=${{ !matrix.valgrind && !matrix.sanitize
        && !startswith(matrix.os, ''windows'') }} -DSEQUANT_USE_SYSTEM_BOOST_HASH=OFF -DCMAKE_CXX_STANDARD=20 -DCMAKE_CXX_EXTENSIONS=OFF
        -DSEQUANT_BENCHMARKS=${{ !matrix.valgrind && !matrix.sanitize }} -DSEQUANT_SKIP_LONG_TESTS=${{ matrix.valgrind ||
        matrix.sanitize }} -DSEQUANT_COMPILE_DOC_EXAMPLES=${{ !matrix.valgrind }} -DSEQUANT_PYTHON=${{ !matrix.valgrind &&
        !matrix.sanitize }} -DSEQUANT_ASSERT_BEHAVIOR=${{ matrix.valgrind && ''IGNORE'' || ''THROW'' }}

        '
      BUILD_JOBS: ${{ matrix.build_jobs || 2 }}
      TEST_JOBS: ${{ matrix.test_jobs || 1 }}
      EXPERIMENT_PHASE: cold
      EXPERIMENT_VARIANT: ${{ matrix.experiment || 'baseline' }}
      SOURCE_SHA: cbb1333b1ae562ca156ee63e39f02be50728ab3d
      CCACHE_MAXSIZE: 1G
    steps:
    - name: Checkout instrumentation
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
    - name: Preserve measurement helper
      shell: bash
      run: 'cp .github/ci-timing-metrics.py "$RUNNER_TEMP/ci-timing-metrics.py"

        df -h'
    - name: Checkout fixed source
      uses: actions/checkout@v7
      with:
        ref: cbb1333b1ae562ca156ee63e39f02be50728ab3d
    - name: free up disk space on Ubuntu runner
      if: ${{ startswith(matrix.os, 'ubuntu') && matrix.experiment != 'no-cleanup' }}
      uses: jlumbroso/free-disk-space@main
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - name: Install Python packages
      run: pip install --index-url https://download.pytorch.org/whl/cpu numpy torch
    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build
    - name: Record environment
      shell: bash
      run: 'mkdir -p "$RUNNER_TEMP/ci-timing-results"

        { git rev-parse HEAD; python --version; pip freeze; cmake --version; uname -a; df -h; } | tee "$RUNNER_TEMP/ci-timing-results/environment.txt"'
    - name: Set sanitizer flags
      if: ${{ matrix.sanitize }}
      shell: bash
      run: "if [[ '${{ matrix.sanitize }}' = 'true' ]]; then\n  echo \"CXXFLAGS=${{ matrix.sanitize_flags }}\" >> \"$GITHUB_ENV\"\
        \nfi\n"
    - name: Install prerequisite MacOS packages
      if: ${{ startswith(matrix.os, 'macos') }}
      run: brew install boost eigen open-mpi ccache
    - name: Install prerequisites Ubuntu packages
      if: ${{ startswith(matrix.os, 'ubuntu') }}
      run: 'sudo apt-get update

        sudo apt-get install ninja-build g++-14 liblapack-dev libboost-dev libboost-locale-dev libboost-random-dev libboost-regex-dev
        libeigen3-dev openmpi-bin libopenmpi-dev ccache valgrind catch2

        '
    - name: Setup MSVC
      if: ${{ startswith(matrix.os, 'windows') }}
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64
    - name: Install ccache on Windows
      if: ${{ startswith(matrix.os, 'windows') }}
      run: choco install ccache -y --no-progress
    - name: Install prerequisites Windows packages
      if: ${{ startswith(matrix.os, 'windows') }}
      id: vcpkg
      uses: johnwason/vcpkg-action@v8
      with:
        pkgs: eigen3 boost-locale boost-random boost-regex boost-container boost-container-hash boost-hana boost-multiprecision
          boost-conversion boost-interval boost-range boost-spirit
        triplet: x64-windows
        token: ${{ github.token }}
      continue-on-error: true
    - name: Retry Windows prerequisites
      if: ${{ startswith(matrix.os, 'windows') && steps.vcpkg.outcome == 'failure' }}
      id: vcpkg_retry
      uses: johnwason/vcpkg-action@v8
      with:
        pkgs: eigen3 boost-locale boost-random boost-regex boost-container boost-container-hash boost-hana boost-multiprecision
          boost-conversion boost-interval boost-range boost-spirit
        triplet: x64-windows
        token: ${{ github.token }}
    - name: Configure CMake
      shell: bash
      env:
        VCPKG_CMAKE_CONFIG: ${{ steps.vcpkg.outputs.vcpkg-cmake-config || steps.vcpkg_retry.outputs.vcpkg-cmake-config }}
      run: python "$RUNNER_TEMP/ci-timing-metrics.py" configure -- python "$RUNNER_TEMP/ci-timing-metrics.py" configure --
        python "$RUNNER_TEMP/ci-timing-metrics.py" configure -- python "$RUNNER_TEMP/ci-timing-metrics.py" configure -- cmake
        -DCMAKE_BUILD_TYPE=$BUILD_TYPE $BUILD_CONFIG -B $GITHUB_WORKSPACE/build -S $GITHUB_WORKSPACE -DSEQUANT_QUICK_BENCHMARKS=ON
        $VCPKG_CMAKE_CONFIG
    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: ccache -p && ccache -z && python "$RUNNER_TEMP/ci-timing-metrics.py" build -- cmake --build . -j "$BUILD_JOBS"
        && ccache -s
    - name: Save ccache cache files
      uses: actions/cache/save@v6
      with:
        path: ${{github.workspace}}/build/.ccache
        key: ci-timing-${{ github.run_id }}-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.sanitize }}-${{ matrix.valgrind
          }}
    - name: Test
      if: ${{ !matrix.valgrind }}
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: 'ctest --show-only=json-v1 -R "^sequant" > "$RUNNER_TEMP/ci-timing-results/test-list.json"

        python "$RUNNER_TEMP/ci-timing-metrics.py" test -- ctest --output-on-failure -R "^sequant" -j "$TEST_JOBS" --output-junit
        "$RUNNER_TEMP/ci-timing-results/tests.xml"'
    - name: Ensure benchmarks not broken
      if: ${{ !matrix.valgrind && !matrix.sanitize }}
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: python "$RUNNER_TEMP/ci-timing-metrics.py" benchmarks -- python "$RUNNER_TEMP/ci-timing-metrics.py" benchmarks
        -- python "$RUNNER_TEMP/ci-timing-metrics.py" benchmarks -- python "$RUNNER_TEMP/ci-timing-metrics.py" benchmarks
        -- ./benchmarks/sequant_benchmarks --benchmark_dry_run=true
    - name: Test (+ Valgrind)
      if: ${{ matrix.valgrind }}
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: python "$RUNNER_TEMP/ci-timing-metrics.py" valgrind -- python "$RUNNER_TEMP/ci-timing-metrics.py" valgrind -- python
        "$RUNNER_TEMP/ci-timing-metrics.py" valgrind -- python "$RUNNER_TEMP/ci-timing-metrics.py" valgrind -- valgrind --error-exitcode=1
        --leak-check=full ./tests/unit/unit_tests-sequant '~[valgrind_skip]'
    - name: Capture final cache statistics
      if: ${{ always() }}
      shell: bash
      run: 'mkdir -p "$RUNNER_TEMP/ci-timing-results"

        ccache -s > "$RUNNER_TEMP/ci-timing-results/ccache.txt"

        ccache --print-stats > "$RUNNER_TEMP/ci-timing-results/ccache-counters.tsv"'
    - name: Upload timing reports
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: cold-${{ matrix.experiment || 'baseline' }}-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.sanitize }}-${{
          matrix.valgrind }}
        path: ${{ runner.temp }}/ci-timing-results/
        retention-days: 3
        if-no-files-found: warn
    if: ${{ github.repository == 'ajay-mk/SeQuant' }}
  warm:
