name: PR Benchmark

on:
  issue_comment:
    types: [created]

jobs:
  benchmark:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@bot run benchmark')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write

    env:
      CXX: /usr/bin/g++-14
      BUILD_CONFIG: >
        -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_SHARED_LIBS=OFF
        -DCMAKE_UNITY_BUILD=OFF
        -DMPIEXEC_PREFLAGS='--bind-to;none;--allow-run-as-root'
        -DCMAKE_PREFIX_PATH='/usr/local/opt/boost'
        -DSEQUANT_TESTS=OFF
        -DSEQUANT_EVAL_TESTS=OFF
        -DSEQUANT_USE_SYSTEM_BOOST_HASH=OFF
        -DCMAKE_CXX_STANDARD=20
        -DCMAKE_CXX_EXTENSIONS=OFF
        -DSEQUANT_BENCHMARKS=ON

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.issue.pull_request.head.sha }}

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 liblapack-dev libboost-dev libboost-locale-dev libboost-random-dev libboost-regex-dev libeigen3-dev openmpi-bin libopenmpi-dev ccache libbenchmark-dev python3-pip

      - name: Create build directory
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake (PR branch)
        working-directory: ${{github.workspace}}/build
        run: cmake $GITHUB_WORKSPACE $BUILD_CONFIG

      - name: Build benchmark target (PR branch)
        working-directory: ${{github.workspace}}/build
        run: cmake --build . --target benchmark_target

      - name: Run benchmark (PR branch)
        working-directory: ${{github.workspace}}/build
        run: ./benchmarks/sequant_benchmarks --benchmark_format=json > pr_bench.json

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.issue.pull_request.base.sha }}

      - name: Create build directory (base)
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake (base branch)
        working-directory: ${{github.workspace}}/build
        run: cmake $GITHUB_WORKSPACE $BUILD_CONFIG

      - name: Build benchmark target (base branch)
        working-directory: ${{github.workspace}}/build
        run: cmake --build . --target benchmark_target

      - name: Run benchmark (base branch)
        working-directory: ${{github.workspace}}/build
        run: ./benchmarks/sequant_benchmarks --benchmark_format=json > base_bench.json

      - name: Download compare.py
        run: |
          curl -L -o compare.py https://raw.githubusercontent.com/google/benchmark/main/tools/compare.py

      - name: Compare benchmark results
        working-directory: ${{github.workspace}}/build
        run: |
          pip3 install numpy scipy
          python3 ../compare.py base_bench.json pr_bench.json > cmp_results.txt

      - name: Post benchmark comparison as PR comment
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('${{github.workspace}}/build/cmp_results.txt', 'utf8');
            github.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Benchmark comparison\n\`\`\`\n${body}\n\`\`\``
            });
